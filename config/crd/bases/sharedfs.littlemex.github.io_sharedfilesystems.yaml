              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SharedFilesystemSpec defines a file system that the platform
              admin offers to tenants.
            properties:
              allowedNamespaces:
                description: |-
                  allowedNamespaces selects the namespaces whose SharedFilesystemClaims are accepted.
                  When omitted, no namespace is allowed.
                properties:
                  selector:
                    description: |-
                      selector matches namespace labels. An empty selector ({}) matches every namespace.
