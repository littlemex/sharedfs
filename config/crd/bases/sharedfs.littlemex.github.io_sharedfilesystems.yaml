                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the generation this status was
                  computed from.
                format: int64
                type: integer
              resolved:
                description: |-
                  resolved is the source as last read. Claims use it only while SourceResolved is True and
                  observedGeneration equals metadata.generation.
                properties:
                  capacity:
                    description: capacity of the source PersistentVolume, as a quantity
                      string.
                    type: string
                  driver:
                    description: driver is the CSI driver name.
                    type: string
                  mountOptions:
                    description: mountOptions of the source with any rw/ro option
