metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sharedfilesystems.sharedfs.littlemex.github.io
spec:
  group: sharedfs.littlemex.github.io
  names:
    categories:
    - sharedfs
    kind: SharedFilesystem
    listKind: SharedFilesystemList
    plural: sharedfilesystems
    shortNames:
    - sfs
    singular: sharedfilesystem
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.persistentVolumeRef.name
      name: Volume
      type: string
    - jsonPath: .status.resolved.driver
      name: Driver
      type: string
    - jsonPath: .status.volumes
      name: Volumes
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SharedFilesystem offers one existing file system, through its static PersistentVolume, to the
          namespaces its grants select. It is created by the platform admin.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SharedFilesystemSpec offers one existing file system to the
              namespaces its grants select.
            properties:
              grants:
                description: |-
                  grants decide which namespaces may claim the file system. A namespace selected by
                  several grants gets the strongest access among them. With no grants, no namespace may.
                items:
                  description: Grant lets the namespaces it selects mount the file
                    system with at most the given access.
                  properties:
                    access:
                      default: ReadOnly
                      description: access is the strongest mount the selected namespaces
                        may ask for.
                      enum:
                      - ReadOnly
                      - ReadWrite
                      type: string
                    namespaceSelector:
                      description: |-
                        namespaceSelector matches namespace labels. It must not be empty, so a selector whose
                        fields were dropped by a typo does not grant every namespace; to grant every namespace,
                        match kubernetes.io/metadata.name with operator Exists. To name namespaces one by one,
                        match kubernetes.io/metadata.name with In. Tenants must not be able to edit the labels
                        this selector reads.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                  required:
                  - namespaceSelector
                  type: object
                  x-kubernetes-validations:
                  - message: namespaceSelector must not be empty; to grant every namespace,
                      match kubernetes.io/metadata.name with operator Exists
                    rule: (has(self.namespaceSelector.matchLabels) && size(self.namespaceSelector.matchLabels)
                      > 0) || (has(self.namespaceSelector.matchExpressions) && size(self.namespaceSelector.matchExpressions)
                      > 0)
                maxItems: 16
                type: array
                x-kubernetes-list-type: atomic
              persistentVolumeRef:
                description: |-
                  persistentVolumeRef names the existing static PersistentVolume that points at the file
                  system. Its CSI fields are copied into every generated PersistentVolume; the
                  PersistentVolume itself is only read, and its phase does not matter. Immutable.
                properties:
                  name:
                    description: name of the PersistentVolume.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: persistentVolumeRef is immutable; create a new SharedFilesystem
                    instead
                  rule: self == oldSelf
            required:
            - persistentVolumeRef
            type: object
          status:
            description: SharedFilesystemStatus is the observed state of a SharedFilesystem.
            properties:
              conditions:
                description: 'conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the generation this status was
                  computed from.
                format: int64
                type: integer
              resolved:
                description: resolved is the source as last read successfully.
                properties:
                  capacity:
                    anyOf:
                    - type: integer
                    - type: string
                    description: capacity of the source PersistentVolume.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  driver:
                    description: driver is the CSI driver name.
                    type: string
                  mountOptions:
                    description: mountOptions of the source without any rw or ro option.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  volumeAttributes:
                    additionalProperties:
                      type: string
                    description: volumeAttributes copied for the keys the driver reads.
                    type: object
                  volumeHandle:
                    description: volumeHandle of the source PersistentVolume.
                    type: string
                required:
                - capacity
                - driver
                - volumeHandle
                type: object
              volumes:
                description: volumes is the number of generated PersistentVolumes
                  that point at this file system.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
