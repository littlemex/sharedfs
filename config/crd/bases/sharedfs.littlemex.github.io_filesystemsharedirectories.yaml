    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FilesystemShareDirectory binds a per-namespace directory of a FilesystemShare to the namespace
          (by UID) that first claimed it, and reports its preparation. The controller creates it;
          deleting it is how an admin lets a recreated namespace take the directory over.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FilesystemShareDirectorySpec records which namespace a per-namespace directory belongs to. The
              controller writes it when the namespace first claims the share; the whole spec is immutable.
            properties:
              namespace:
                description: namespace whose claims mount this directory.
                type: string
              namespaceUID:
                description: |-
                  namespaceUID of that namespace when the directory was first claimed. A namespace of the
                  same name with another UID is a different tenant: its claims are not provisioned until an
                  admin deletes this object.
                type: string
              path:
                description: path is the expanded path inside the file system.
                type: string
              shareRef:
                description: ShareReference identifies a FilesystemShare by name and
                  UID.
                properties:
                  name:
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - name
                - uid
                type: object
            required:
            - namespace
            - namespaceUID
            - path
            - shareRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: FilesystemShareDirectoryStatus is the observed state of the
              directory.
            properties:
              conditions:
                description: 'conditions: Prepared.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
