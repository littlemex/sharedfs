# The preparer's internal claims mount a parent directory read-write. Only the controller may
# create a claim on an internal volume or a pod that uses one, so nobody with pod access in the
# controller namespace can reuse them. The names below assume the default namespace and
# namePrefix of config/default; change them together.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: internal-volumes
  labels:
    app.kubernetes.io/name: sharedfs
    app.kubernetes.io/managed-by: kustomize
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "persistentvolumeclaims"]
  variables:
  - name: controller
    expression: "request.userInfo.username == 'system:serviceaccount:sharedfs-system:sharedfs-controller-manager'"
  validations:
  - expression: >-
      variables.controller || request.kind.kind != 'Pod' || !has(object.spec.volumes) ||
      !object.spec.volumes.exists(v, has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName.startsWith('sfs-prep-'))
    message: "only the sharedfs controller may run pods on its internal claims (sfs-prep-*)"
  - expression: >-
      variables.controller || request.kind.kind != 'PersistentVolumeClaim' ||
      !(object.metadata.name.startsWith('sfs-prep-') || (has(object.spec.volumeName) && object.spec.volumeName.startsWith('sfs-prep-')))
    message: "only the sharedfs controller may create claims on its internal volumes (sfs-prep-*)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: internal-volumes
  labels:
    app.kubernetes.io/name: sharedfs
    app.kubernetes.io/managed-by: kustomize
spec:
  policyName: internal-volumes
  validationActions: [Deny]
