# Bounds what the controller's service account can do with its ClusterRole: the volumes it creates
# are CSI volumes of the supported drivers, named sfs-*, with a sharedfs handle and a claim
# reference; the claims it creates are its internal ones, bound by name to their volume; the
# claims and volumes it deletes are its own; and the pods it runs have the exact shape of its
# preparer and quota pods, from the image repositories in the sharedfs-guard ConfigMap, by digest.
#
# What remains: such a volume can still point at any directory of a supported file system, so
# the controller stays part of the trusted base for file-system access. The names below assume
# the namespaces and name prefix of config/default and config/quota; change them together.
apiVersion: v1
kind: ConfigMap
metadata:
  name: guard
  namespace: system
  labels:
    app.kubernetes.io/name: sharedfs
data:
  # Repositories (no tag, no digest) preparer and quota pods may run from. The preparer runs the
  # controller's image; set both before deploying.
  preparerRepository: registry.example.com/sharedfs-controller
  quotaRepository: registry.example.com/sharedfs-quota
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controller-guard-volumes
  labels:
    app.kubernetes.io/name: sharedfs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["persistentvolumes"]
  matchConditions:
  - name: by-controller
    expression: "request.userInfo.username == 'system:serviceaccount:sharedfs-system:sharedfs-controller-manager'"
  validations:
  - expression: >-
      request.operation == 'DELETE' ? oldObject.metadata.name.startsWith('sfs-') :
      (object.metadata.name.startsWith('sfs-') && has(object.spec.csi) &&
       object.spec.csi.driver in ['fsx.csi.aws.com', 'fsx.openzfs.csi.aws.com'] &&
       object.spec.csi.volumeHandle.startsWith('sharedfs:') &&
       has(object.spec.claimRef) && has(object.spec.claimRef.uid) &&
       ((!object.metadata.name.startsWith('sfs-prep-') && !object.metadata.name.startsWith('sfs-quota-')) ||
        (object.spec.claimRef.namespace in ['sharedfs-system', 'sharedfs-quota'] && object.spec.claimRef.name == object.metadata.name)))
    message: "the sharedfs controller may only create, change and delete its own CSI volumes: supported drivers, named sfs-*, with a sharedfs handle, reserved for a claim by UID"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: controller-guard-volumes
  labels:
    app.kubernetes.io/name: sharedfs
spec:
  policyName: controller-guard-volumes
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controller-guard-claims
  labels:
    app.kubernetes.io/name: sharedfs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "DELETE"]
      resources: ["persistentvolumeclaims"]
  matchConditions:
  - name: by-controller
    expression: "request.userInfo.username == 'system:serviceaccount:sharedfs-system:sharedfs-controller-manager'"
  validations:
  - expression: >-
      request.operation == 'DELETE' ?
        (oldObject.metadata.name.startsWith('sfs-prep-') || oldObject.metadata.name.startsWith('sfs-quota-') ||
         (has(oldObject.spec.volumeName) && oldObject.spec.volumeName.startsWith('sfs-'))) :
        (object.metadata.namespace in ['sharedfs-system', 'sharedfs-quota'] &&
         (object.metadata.name.startsWith('sfs-prep-') || object.metadata.name.startsWith('sfs-quota-')) &&
         object.spec.volumeName == object.metadata.name)
    message: "the sharedfs controller may only create its internal claims, bound by name to their volume, and delete claims bound to sharedfs volumes"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: controller-guard-claims
  labels:
    app.kubernetes.io/name: sharedfs
spec:
  policyName: controller-guard-claims
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controller-guard-pods
  labels:
    app.kubernetes.io/name: sharedfs
spec:
  failurePolicy: Fail
  paramKind: {apiVersion: v1, kind: ConfigMap}
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
  matchConditions:
  - name: by-controller
    expression: "request.userInfo.username == 'system:serviceaccount:sharedfs-system:sharedfs-controller-manager'"
  validations:
  - expression: >-
      (object.metadata.namespace == 'sharedfs-system' && object.metadata.name.startsWith('sfs-prep-') &&
        object.spec.containers.all(c, c.image.split('@')[0] == params.data.preparerRepository &&
          c.securityContext.capabilities.add.all(a, a == 'CHOWN'))) ||
      (object.metadata.namespace == 'sharedfs-quota' && object.metadata.name.startsWith('sfs-quota-') &&
        object.spec.containers.all(c, c.image.split('@')[0] == params.data.quotaRepository &&
          c.securityContext.capabilities.add.all(a, a in ['SYS_ADMIN', 'DAC_READ_SEARCH'])))
    message: "the sharedfs controller may only run its preparer and quota pods, from the configured repositories, with their capabilities"
  - expression: >-
      object.spec.containers.size() == 1 &&
      object.spec.containers.all(c, c.image.contains('@sha256:') &&
        has(c.securityContext) && has(c.securityContext.capabilities) &&
        has(c.securityContext.capabilities.drop) && c.securityContext.capabilities.drop.exists(d, d == 'ALL') &&
        !(has(c.securityContext.privileged) && c.securityContext.privileged) &&
        has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation) &&
      !(has(object.spec.hostNetwork) && object.spec.hostNetwork) &&
      !(has(object.spec.hostPID) && object.spec.hostPID) &&
      !(has(object.spec.hostIPC) && object.spec.hostIPC) &&
      has(object.spec.securityContext) && has(object.spec.securityContext.seccompProfile) &&
      object.spec.securityContext.seccompProfile.type == 'RuntimeDefault' &&
      !has(object.spec.initContainers) && !has(object.spec.ephemeralContainers) &&
      has(object.spec.automountServiceAccountToken) && !object.spec.automountServiceAccountToken &&
      has(object.spec.volumes) && object.spec.volumes.size() == 1 &&
      object.spec.volumes.all(v, has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == object.metadata.name) &&
      !has(object.spec.securityContext.sysctls) &&
      object.spec.containers.all(c, !has(c.command) && !has(c.env) && !has(c.envFrom) &&
        has(c.args) && c.args.size() > 0 && c.args[0] in ['prepare-directory', 'set-quota'] &&
        has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem &&
        (!has(c.securityContext.seccompProfile) || c.securityContext.seccompProfile.type == 'RuntimeDefault') &&
        !has(c.securityContext.procMount) && !has(c.securityContext.appArmorProfile) &&
        !has(c.securityContext.seLinuxOptions) && !has(c.securityContext.windowsOptions))
    message: "a task pod must be one container by digest running the controller's binary (no command, a task argument, no environment), dropping all other capabilities, without privilege, host namespaces, sysctls or a token, read-only root, RuntimeDefault seccomp, mounting only its own internal claim"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: controller-guard-pods
  labels:
    app.kubernetes.io/name: sharedfs
spec:
  policyName: controller-guard-pods
  paramRef:
    name: sharedfs-guard
    namespace: sharedfs-system
    parameterNotFoundAction: Deny
  validationActions: [Deny]
