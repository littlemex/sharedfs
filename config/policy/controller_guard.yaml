# Bounds what the controller's own service account can do, so a compromised controller cannot
# turn its ClusterRole into node or file-system access: the volumes it creates are CSI volumes of
# the supported drivers named sfs-*, the claims it deletes are bound to such volumes, and the pods
# it runs mount only its internal claims. It applies to requests by the controller only. The
# names assume the namespace and name prefix of config/default; change them together.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controller-guard
  labels:
    app.kubernetes.io/name: sharedfs
    app.kubernetes.io/managed-by: kustomize
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["persistentvolumes", "pods"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["DELETE"]
      resources: ["persistentvolumeclaims", "persistentvolumes"]
  matchConditions:
  - name: by-controller
    expression: "request.userInfo.username == 'system:serviceaccount:sharedfs-system:sharedfs-controller-manager'"
  validations:
  - expression: >-
      request.kind.kind != 'PersistentVolume' || request.operation == 'DELETE' ||
      (object.metadata.name.startsWith('sfs-') && has(object.spec.csi) &&
       object.spec.csi.driver in ['fsx.csi.aws.com', 'fsx.openzfs.csi.aws.com'] &&
       object.spec.csi.volumeHandle.startsWith('sharedfs:'))
    message: "the sharedfs controller may only create CSI volumes of the supported drivers named sfs-* with a sharedfs handle"
  - expression: >-
      request.kind.kind != 'Pod' ||
      (object.metadata.namespace == 'sharedfs-system' && object.metadata.name.startsWith('sfs-prep-') &&
       object.spec.containers.all(c, c.image.contains('@sha256:') &&
         has(c.securityContext) && has(c.securityContext.privileged) == false) &&
       object.spec.volumes.all(v, has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName.startsWith('sfs-prep-')))
    message: "the sharedfs controller may only run preparer pods: pinned image, not privileged, only its internal claims"
  - expression: >-
      request.kind.kind != 'PersistentVolume' || request.operation != 'DELETE' || oldObject.metadata.name.startsWith('sfs-')
    message: "the sharedfs controller may only delete its own volumes (sfs-*)"
  - expression: >-
      request.kind.kind != 'PersistentVolumeClaim' ||
      oldObject.metadata.name.startsWith('sfs-prep-') ||
      (has(oldObject.spec.volumeName) && oldObject.spec.volumeName.startsWith('sfs-'))
    message: "the sharedfs controller may only delete claims bound to sharedfs volumes"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: controller-guard
  labels:
    app.kubernetes.io/name: sharedfs
    app.kubernetes.io/managed-by: kustomize
spec:
  policyName: controller-guard
  validationActions: [Deny]
