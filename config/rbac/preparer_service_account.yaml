# Preparer pods run as this account. It is bound to nothing and its token is never mounted, so a
# pod that holds a read-write mount of a parent directory cannot reach the API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preparer
  namespace: system
  labels:
    app.kubernetes.io/name: sharedfs
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
