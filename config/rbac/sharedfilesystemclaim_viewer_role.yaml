# This rule is not used by the project sharedfs itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to sharedfs.littlemex.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sharedfs
    app.kubernetes.io/managed-by: kustomize
  name: sharedfilesystemclaim-viewer-role
rules:
- apiGroups:
  - sharedfs.littlemex.github.io
  resources:
  - sharedfilesystemclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sharedfs.littlemex.github.io
  resources:
  - sharedfilesystemclaims/status
  verbs:
  - get
