# Optional: per-directory Lustre project quotas (FilesystemShare spec.provision.quota). Quota pods
# need CAP_SYS_ADMIN, which Pod Security baseline does not allow, so they run in a namespace of
# their own that holds nothing else. Apply after config/default, then start the controller with
# --quota-namespace=sharedfs-quota --quota-image=<image by digest built from Dockerfile.quota>.
apiVersion: v1
kind: Namespace
metadata:
  name: sharedfs-quota
  labels:
    app.kubernetes.io/name: sharedfs
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sharedfs-quota
  namespace: sharedfs-quota
  labels: {app.kubernetes.io/name: sharedfs}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sharedfs-quota-manager
  namespace: sharedfs-quota
  labels: {app.kubernetes.io/name: sharedfs}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sharedfs-quota-manager
  namespace: sharedfs-quota
  labels: {app.kubernetes.io/name: sharedfs}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: sharedfs-quota-manager}
subjects:
- {kind: ServiceAccount, name: sharedfs-controller-manager, namespace: sharedfs-system}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quota-deny-all
  namespace: sharedfs-quota
  labels: {app.kubernetes.io/name: sharedfs}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# The quota namespace is privileged, so nobody but the controller may run pods there, or exec,
# attach or add ephemeral containers to them; the controller's own pods are further bound by
# config/policy (controller-guard).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sharedfs-quota-namespace
  labels: {app.kubernetes.io/name: sharedfs}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: sharedfs-quota}
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "pods/ephemeralcontainers"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CONNECT"]
      resources: ["pods/exec", "pods/attach", "pods/portforward"]
  variables:
  - name: main
    expression: "!has(request.subResource) || request.subResource == ''"
  validations:
  - expression: >-
      variables.main && (request.operation == 'UPDATE' ||
        request.userInfo.username == 'system:serviceaccount:sharedfs-system:sharedfs-controller-manager')
    message: "only the sharedfs controller runs pods in sharedfs-quota, and nobody execs into them"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sharedfs-quota-namespace
  labels: {app.kubernetes.io/name: sharedfs}
spec:
  policyName: sharedfs-quota-namespace
  validationActions: [Deny]
