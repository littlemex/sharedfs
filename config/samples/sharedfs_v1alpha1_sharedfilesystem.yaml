apiVersion: sharedfs.littlemex.github.io/v1alpha1
kind: SharedFilesystem
metadata:
  name: training-data
spec:
  persistentVolumeRef:
    name: fsx-training
  grants:
  - namespaceSelector:
      matchLabels:
        sharedfs.example.com/training-data: rw
    access: ReadWrite
  - namespaceSelector:
      matchLabels:
        sharedfs.example.com/training-data: ro
    access: ReadOnly
